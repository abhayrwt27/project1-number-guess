<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NumGuess – Minimalist Number Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="background">
      <div class="gradient-1"></div>
      <div class="gradient-2"></div>
    </div>

    <main class="container">
      <div class="game-wrapper">
        <header class="header">
          <h1 class="title">numguess</h1>
          <p class="subtitle">guess the number</p>
        </header>

        <section class="stats">
          <div class="stat">
            <span class="label">best</span>
            <span class="value" id="bestSession">—</span>
          </div>
          <div class="stat">
            <span class="label">games</span>
            <span class="value" id="sessionGames">0</span>
          </div>
          <div class="stat">
            <span class="label">attempt</span>
            <span class="value" id="attempts">0</span>
          </div>
          <div class="stat">
            <span class="label">range</span>
            <span class="value" id="range">1-50</span>
          </div>
        </section>

        <section class="difficulty-selector">
          <button class="difficulty-btn active" data-range="50">easy</button>
          <button class="difficulty-btn" data-range="100">medium</button>
          <button class="difficulty-btn" data-range="200">hard</button>
        </section>

        <div class="message" id="messageBox">select difficulty to start</div>

        <form id="guessForm" class="input-section">
          <input
            id="guessInput"
            type="number"
            placeholder="your guess"
            min="1"
            disabled
          />
          <button type="submit" id="submitBtn" disabled>guess</button>
        </form>

        <div class="actions">
          <button id="newGameBtn" class="action-btn">new game</button>
          <button id="leaderboardBtn" class="action-btn">leaderboard</button>
        </div>
      </div>
    </main>

    <div id="leaderboardModal" class="modal">
      <div class="modal-overlay"></div>
      <div class="modal-box">
        <div class="modal-header">
          <h2>leaderboard</h2>
          <button class="close-btn" id="closeLeaderboardBtn">×</button>
        </div>
        <div class="modal-body">
          <div id="leaderboardList" class="leaderboard-list"></div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
